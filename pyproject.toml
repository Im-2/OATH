[project]
name = "oath"
version = "0.0.1"
description = "OATH (Proof-of-Thesis): commit-reveal honesty layer for autonomous trading agents"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "solders>=0.21",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oath_core", "oath_server"]
